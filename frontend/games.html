<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game.Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/games.css">
</head>
<body>

    <div id="progress-bar"></div>

    <nav>
        <a class="nav-logo" href="#">game<span>.</span>library</a>
        <div class="nav-links">
            <a href="games.html" class="active">Library</a>
        </div>
        <div class="nav-right">
            <button onclick="window.location.href='profile.html'">Profile</button>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- ADD GAME -->
         <div class="add-game">
            <div class="add-game-title">Add game</div>
            <div class="add-row">
                <div style="position: relative; flex: 1; min-width: 0;">
                    <input type="text" id="gameTitle" class="add-input" placeholder="Search title or paste link…"
                    oninput="searchGames(this.value)" onclick="searchGames(this.value)">
                    <div id="search-result" class="search-dropdown"></div>
                </div>
                <!--
                <select class="add-select" id="gameStatus">
                    <option value="PLANNED">Planned</option>
                    <option value="PLAYING">Playing</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="DROPPED">Dropped</option>
                </select>
                -->
                <button class="btn-add" onclick="addGame()">Add</button>
                <button class="btn-manual" onclick="showManualForm()">Manual</button>
            </div>

            <!-- Manual form -->
             <div id="manual-form" style="display: none; margin-top: 1px;">
                <div class="add-row">
                    <select id="gameGenre" class="add-select" style="flex: 1;">
                            <option value="">Genre…</option>
                                <option>Action</option>
                                <option>RPG</option>
                                <option>Strategy</option>
                                <option>Simulator</option>
                                <option>Sports</option>
                                <option>Puzzle</option>
                                <option>Shooter</option>
                                <option>Other</option>
                            </select>
                    <select id="gamePlatform" class="add-select" style="flex: 1;">
                        <option value="">Platform…</option>
                        <option>PC</option>
                        <option>PlayStation 5</option>
                        <option>PlayStation 4</option>
                        <option>Xbox Series X|S</option>
                        <option>Nintendo Switch</option>
                        <option>Other</option>
                    </select>
                    <input type="number" id="gameYear" class="add-input" placeholder="Year" readonly
                        style="cursor: default;">
                    <select id="gameStatusManual" class="add-select" style="flex: none;">
                        <option value="PLANNED">Planned</option>
                        <option value="PLAYING">Playing</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="DROPPED">Dropped</option>
                    </select>
                </div>
             </div>
         </div>

         <!-- TOOLBAR -->
          <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" id="library-search" class="library-search" placeholder="Search in library…"
                oninput="searchLibrary(this.value)">
            </div>
            <div class="toolbar-right">
                <select class="sort-select" onchange="sortGames(this.value)">
                    <option value="">Sort by…</option>
                    <option value="title">Name</option>
                    <option value="rating">Rating</option>
                    <option value="status">Status</option>
                </select>
            </div>
          </div>

          <!-- FILTERS desktop -->
           <div class="filter-buttons-desktop filter-row">
            <button id="filter-ALL" class="filter-btn active" onclick="filterGames('ALL')">All</button>
            <button id="filter-PLANNED" class="filter-btn" onclick="filterGames('PLANNED')">Planned</button>
            <button id="filter-PLAYING" class="filter-btn" onclick="filterGames('PLAYING')">Playing</button>
            <button id="filter-DROPPED" class="filter-btn" onclick="filterGames('DROPPED')">Dropped</button>
            <button id="filter-COMPLETED" class="filter-btn" onclick="filterGames('COMPLETED')">Completed</button>
           </div>

           <!-- FILTERS mobile -->
           <div class="filter-buttons-mobile">
            <select class="add-select" style="width: 100%;" onchange="filterGames(this.value)">
                <option value="ALL">All</option>
                <option value="PLANNED">Planned</option>
                <option value="PLAYING">Playing</option>
                <option value="DROPPED">Dropped</option>
                <option value="COMPLETED">Completed</option>
            </select>
           </div>

           <!-- GRID -->
            <div class="games-grid" id="gamesGrid">
                <div class="empty">Loading your games…</div>
            </div>
            <div id="pagination" style="display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 0;"></div>
    </div>

    <!-- OVERLAY -->
     <div id="overlay" onclick="closeSidebar()"></div>

     <!-- SIDEBAR -->
      <div id="sidebar" class="sidebar">
        <div id="sidebar-banner" class="sidebar-banner">
            <div class="sidebar-banner-fade"></div>
        </div>

        <div class="sidebar-header">
            <h2 id="sidebar-title" class="sidebar-title"></h2>
            <button onclick="closeSidebar()" class="sidebar-close">✕</button>
        </div>

        <div id="sidebar-meta" class="sidebar-meta"></div>
        <div id="sidebar-status"></div>

        <select id="status-select" onchange="updateStatus(this.value)" class="status-select">
            <option value="PLANNED">Planned</option>
            <option value="PLAYING">Playing</option>
            <option value="COMPLETED">Completed</option>
            <option value="DROPPED">Dropped</option>
        </select>

        <hr class="sidebar-divider">
        <h3 class="sidebar-section-title">Review</h3>
        <div id="sidebar-reviews"></div>
      </div>

      <!-- BACK TO TOP -->
        <button id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>

      <!-- CONFIRM DIALOG -->
        <div id="confirm-dialog">
            <div class="confirm-box">
                <p>Are you sure you want to delete this game?</p>
                <div class="confirm-actions">
                    <button class="btn-confirm-yes" id="confirm-yes">Delete</button>
                    <button class="btn-confirm-no" id="confirm-no">Cancel</button>
                </div>
            </div>
        </div>

        <script src="./js/auth.js"></script>
        <script src="./js/games.js"></script>
</body>
</html>
