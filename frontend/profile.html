<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game.Library — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>
    <div id="progress-bar"></div>
    <nav>
        <a class="nav-logo" href="#">game<span>.</span>library</a>
        <div class="nav-links">
            <div style="position: relative;">
                <input 
                    type="text" 
                    id="user-search" 
                    class="library-search" 
                    placeholder="Search users…"
                    oninput="searchUsers(this.value)"
                    autocomplete="off">
                <div id="user-search-results" style="
                    position: absolute; top: 100%; right: 0;
                    background: var(--surface);
                    border: 1px solid var(--border-strong);
                    min-width: 200px; z-index: 200; display: none;">
                </div>
        </div>
            <a href="profile.html" class="active">Profile</a>
        </div>
        <div class="nav-right">
            <button onclick="window.location.href='games.html'">Library</button>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- PROFILE HEADER -->
        <div class="profile-header">
            <div class="profile-avatar-wrap">
                <div id="profile-avatar" class="profile-avatar">P</div>
                <div class="online-dot"></div>
            </div>
            <div class="profile-info">
                <div class="profile-handle-label">@<span id="profile-username">username</span></div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="profile-name" id="profile-display-name">username</div>
                    <button id="btn-edit-displayname" onclick="editDisplayName()" style="
                        font-family: var(--font-mono); font-size: 10px; font-weight: 500;
                        letter-spacing: 0.08em; text-transform: uppercase;
                        background: transparent; border: 1px solid var(--border-strong);
                        color: var(--text-muted); padding: 4px 10px; cursor: pointer;
                        transition: color 0.15s, border-color 0.15s;"
                        onmouseover="this.style.color='var(--accent)'; this.style.borderColor='rgba(200,240,96,0.3)'"
                        onmouseout="this.style.color='var(--text-muted)'; this.style.borderColor='var(--border-strong)'">
                        Edit
                    </button>
                </div>
                <div class="profile-email" id="profile-email"></div>
                <div class="profile-stats">
                    <div class="pstat">
                        <div class="pstat-n" id="count-total">0</div>
                        <div class="pstat-l">All games</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-completed">0</div>
                        <div class="pstat-l">Completed</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-playing">0</div>
                        <div class="pstat-l">Playing</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-planned">0</div>
                        <div class="pstat-l">Planned</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-dropped">0</div>
                        <div class="pstat-l">Dropped</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CURRENTLY PLAYING -->
        <div class="currently-playing" id="currently-playing" style="display:none;">
            <div class="cp-label">▶ Now playing</div>
            <div class="cp-title" id="cp-title">—</div>
            <div class="cp-sub" id="cp-sub">—</div>
        </div>

        <!-- STATS ROW -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">Statistics</div>
            </div>
            <div class="stats-row">
                <div class="stat-block">
                    <div class="stat-block-n">
                        <span id="total-hours">—</span><span class="stat-block-unit">h </span>
                        <span id="total-minutes">—</span><span class="stat-block-unit">m</span>
                    </div>
                    <div class="stat-block-l">Total time played</div>
                    <div class="stat-block-sub"></div>
                </div>
                <div class="stat-block">
                    <div class="stat-block-n" id="avg-rating">—</div>
                    <div class="stat-block-l">Average score</div>
                    <div class="stat-block-sub" id="avg-rating-sub"></div>
                </div>
                <div class="stat-block">
                    <div class="stat-block-n" id="top-genre">—</div>
                    <div class="stat-block-l">Favourite genre</div>
                    <div id="top-genres" class="genre-list"></div>
                </div>
                <div class="stat-block">
                    <div class="stat-block-n"><span id="completion-rate">—</span><span class="stat-block-unit">%</span>
                    </div>
                    <div class="stat-block-l">Completion rate</div>
                    <div class="stat-block-sub" id="completion-sub"></div>
                </div>
            </div>
        </div>
        <!-- RECENT ACTIVITY -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">Recent reviews</div>
            </div>
            <div id="last-reviews" class="recent-list"></div>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
