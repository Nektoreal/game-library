<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game.Library — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>
    <div id="progress-bar"></div>
    <nav>
        <a class="nav-logo" href="#">game<span>.</span>Library</a>
        <div class="nav-links">
            <a href="profile.html" class="active">Profile</a>
        </div>
        <div class="nav-right">
            <button onclick="window.location.href='games.html'">Library</button>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>
    
    <div class="container">
        <!-- PROFILE HEADEAR -->
         <div class="profile-header">
            <div class="profile-avatar-wrap">
                <div id="profile-avatar" class="profile-avatar">P</div>
            </div>
            <div class="profile-info">
                <div class="profile-handle" id="profile-username">username</div>
                <div class="profile-email" id="profile-email">email</div>
                <div class="profile-stats">
                    <div class="pstat">
                        <div class="pstat-n" id="count-total">0</div>
                        <div class="pstat-l">Total</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-completed">0</div>
                        <div class="pstat-l">Completed</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-playing">0</div>
                        <div class="pstat-l">Playing</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-planned">0</div>
                        <div class="pstat-l">Planned</div>
                    </div>
                    <div class="pstat">
                        <div class="pstat-n" id="count-dropped">0</div>
                        <div class="pstat-l">Dropped</div>
                    </div>
                </div>
            </div>
         </div>

         <!-- STATS ROW -->
          <div class="stats-row">
            <div class="stat-block">
                <div class="stat-block-n" id="avg-rating">—</div>
                <div class="stat-block-l">Avg rating</div>
            </div>
            <div class="stat-block">
                <div class="stat-block-n" id="member-since">—</div>
                <div class="stat-block-l">Member since</div>
            </div>
            <div class="stat-block stat-block-genres">
                <div class="stat-block-l">Top genres</div>
                <div id="top-genres" class="genre-list"></div>
            </div>
          </div>

          <!-- RECENT REVIEWS -->
           <div class="section">
            <div class="section-header">
                <div class="section-title">Recent reviews</div>
            </div>
            <div id="last-reviews" class="reviews-list"></div>
           </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
